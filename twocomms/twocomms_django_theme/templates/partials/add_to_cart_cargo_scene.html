{% load i18n %}
<span class="tc-cargo-scene" data-cargo-scene aria-hidden="true">
  <span class="tc-cargo-belt"><span class="tc-cargo-tread"></span></span>
  <span class="tc-cargo-scanner">
    <span class="tc-cargo-scanner-mount"></span>
    <span class="tc-cargo-scanner-head"></span>
    <span class="tc-cargo-scanner-led"></span>
    <span class="tc-cargo-scanner-ready"></span>
  </span>
  <span class="tc-cargo-laser"></span>
  <span class="tc-cargo-box">
    <span class="tc-cargo-box-face"></span>
    <span class="tc-cargo-barcode"></span>
    <span class="tc-cargo-flap tc-cargo-flap--left"></span>
    <span class="tc-cargo-flap tc-cargo-flap--right"></span>
    <span class="tc-cargo-tape"></span>
    <span class="tc-cargo-label"></span>
    <span class="tc-cargo-flash"></span>
  </span>
  <span class="tc-cargo-cart">
    <svg viewBox="0 0 40 38" aria-hidden="true">
      <path d="M3 5h4.5l2.5 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
      <path d="M7.5 10h28.5l-3.5 17h-20l-5-17z" fill="rgba(12, 13, 18, 0.96)" stroke="currentColor" stroke-width="2" stroke-linejoin="round"></path>
      <circle cx="15" cy="32.5" r="3" fill="#101117" stroke="currentColor" stroke-width="2"></circle>
      <circle cx="28" cy="32.5" r="3" fill="#101117" stroke="currentColor" stroke-width="2"></circle>
    </svg>
    <span class="tc-cargo-badge">+1</span>
  </span>
</span>
<span class="tc-cargo-done" data-cargo-done aria-hidden="true">
  <svg class="tc-cargo-check" viewBox="0 0 24 24" fill="none" aria-hidden="true">
    <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1.6"></circle>
    <path d="M7.2 12.4l3.3 3.3 6.3-6.9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" pathLength="1"></path>
  </svg>
  <span>{% trans 'ДОДАНО' %}</span>
</span>
<span class="visually-hidden" data-cargo-live aria-live="polite"></span>
