name: Immutable release wheelhouse

on:
  push:
    branches: [main]
    paths:
      - "scripts/build_release_wheelhouse.py"
      - "scripts/build_http_ece_wheel.py"
      - "scripts/verify_mysqlclient_wheel_runtime.py"
      - "scripts/verify_locked_requirements.py"
      - "twocomms/requirements.lock"
      - ".github/workflows/immutable-release-wheelhouse.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build CPython 3.14 wheelhouse
    runs-on: ubuntu-24.04
    container:
      image: quay.io/pypa/manylinux_2_28_x86_64@sha256:fdb9a9c223b215604dc7b6f7e8fff4b39bfea5fbaa7777a2e5544a60dfa437f8
    services:
      mariadb:
        image: mariadb:11.4.12@sha256:67873d30a17f6a9c331f06363b2fa15f38abca415529966d67c84f87f82439fe
        env:
          MARIADB_DATABASE: wheelhouse
          MARIADB_USER: wheelhouse
          MARIADB_PASSWORD: wheelhouse
          MARIADB_ROOT_PASSWORD: wheelhouse-root
          MARIADB_ROOT_HOST: "%"
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - name: Check out the exact release revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify the pinned build runtime
        shell: bash
        run: |
          set -euo pipefail
          python=/opt/python/cp314-cp314/bin/python
          test -x "$python"
          test "$("$python" -c 'import platform, sys; print(platform.python_version())')" = "3.14.6"
          test "$("$python" -c 'import sysconfig; print(sysconfig.get_config_var("SOABI"))')" = "cpython-314-x86_64-linux-gnu"
          test "$(ldd --version 2>&1 | head -n 1)" = "ldd (GNU libc) 2.28"
          command -v auditwheel >/dev/null
          command -v readelf >/dev/null
          auditwheel --version

      - name: Install hash-pinned libffi build headers
        shell: bash
        run: |
          set -euo pipefail
          rpm_name=libffi-devel-3.1-24.el8.x86_64.rpm
          rpm_path="/tmp/$rpm_name"
          rpm_url="https://repo.almalinux.org/almalinux/8/BaseOS/x86_64/os/Packages/$rpm_name"
          rpm_sha256=8f5458bc961d226a0383575823f04d89989d801d11b1eeece2fe5498df49f186
          curl --fail --silent --show-error --location "$rpm_url" --output "$rpm_path"
          printf '%s  %s\n' "$rpm_sha256" "$rpm_path" | sha256sum --check --strict -
          rpm -Uvh --replacepkgs "$rpm_path"
          test "$(rpm -q libffi-devel)" = "libffi-devel-3.1-24.el8.x86_64"
          test -f /usr/include/ffi.h

      - name: Install hash-pinned MariaDB Connector/C build libraries
        shell: bash
        run: |
          set -euo pipefail
          connector_archive=/opt/mariadb-connector-c-3.3.19-rhel8-amd64.tar.gz
          connector_root=/opt/mariadb-connector-c-3.3.19
          connector_url="https://dlm.mariadb.com/4751094/Connectors/c/connector-c-3.3.19/mariadb-connector-c-3.3.19-rhel8-amd64.tar.gz"
          connector_sha256=672bec76cfbb2fdb46ad4f681cd1e63c80721d7a07316e5849dc63e69d6ecdf7
          connector_library_sha256=5395b9398e16b3313ed3d799771ec33a4661beb91833648b457a0bfdb0fb36ee
          curl --fail --silent --show-error --location "$connector_url" --output "$connector_archive"
          printf '%s  %s\n' "$connector_sha256" "$connector_archive" | sha256sum --check --strict -
          test ! -e "$connector_root"
          mkdir -m 0755 "$connector_root"
          tar --extract --gzip --file "$connector_archive" --directory "$connector_root" --strip-components=1
          connector_header="$connector_root/include/mariadb/mariadb_version.h"
          connector_library="$connector_root/lib/mariadb/libmariadb.so.3"
          test -f "$connector_header"
          test -f "$connector_library"
          grep -Fx '#define MARIADB_PACKAGE_VERSION "3.3.19"' "$connector_header"
          printf '%s  %s\n' "$connector_library_sha256" "$connector_library" | sha256sum --check --strict -
          test "$(readelf -d "$connector_library" | sed -n 's/.*SONAME.*\[\([^]]*\)\].*/\1/p')" = "libmariadb.so.3"
          ldd_output="$(ldd "$connector_library")"
          if grep -F "not found" <<<"$ldd_output"; then
            exit 1
          fi
          # The connector must retain TLS support in the immutable artifact;
          # an import-only gate would allow a build linked without OpenSSL.
          connector_needed="$(readelf -d "$connector_library")"
          if ! grep -Eq 'Shared library: \[libssl[^]]*\.so' <<<"$connector_needed"; then
            echo "TLS/OpenSSL libssl dependency is missing" >&2
            exit 1
          fi
          if ! grep -Eq 'Shared library: \[libcrypto[^]]*\.so' <<<"$connector_needed"; then
            echo "TLS/OpenSSL libcrypto dependency is missing" >&2
            exit 1
          fi

      - name: Build and verify the immutable wheelhouse
        shell: bash
        run: |
          set -euo pipefail
          python=/opt/python/cp314-cp314/bin/python
          "$python" scripts/build_release_wheelhouse.py \
            --target-sha "${{ github.sha }}" \
            --lock twocomms/requirements.lock \
            --wheelhouse "wheelhouse/${{ github.sha }}" \
            --python "$python" \
            --auditwheel auditwheel \
            --image-digest "sha256:fdb9a9c223b215604dc7b6f7e8fff4b39bfea5fbaa7777a2e5544a60dfa437f8"

      - name: Run the bundled mysqlclient MariaDB gate
        shell: bash
        env:
          MYSQLCLIENT_GATE_HOST: mariadb
          MYSQLCLIENT_GATE_PORT: "3306"
          MYSQLCLIENT_GATE_USER: wheelhouse
          MYSQLCLIENT_GATE_PASSWORD: wheelhouse
          MYSQLCLIENT_GATE_DATABASE: wheelhouse
        run: |
          set -euo pipefail
          python=/opt/python/cp314-cp314/bin/python
          artifact="wheelhouse/${{ github.sha }}"
          gate_venv=/tmp/mysqlclient-wheel-gate
          "$python" -m venv "$gate_venv"
          "$gate_venv/bin/python" -m pip install \
            --disable-pip-version-check \
            --no-index \
            --find-links "$artifact" \
            --only-binary :all: \
            --require-hashes \
            -r "$artifact/requirements.install.lock"
          env -u LD_PRELOAD "$gate_venv/bin/python" scripts/verify_mysqlclient_wheel_runtime.py \
            --evidence "$artifact/builder-evidence.json" \
            --expected-server-version 11.4.12 \
            --iterations 100

      - name: Assert artifact provenance
        shell: bash
        run: |
          set -euo pipefail
          python=/opt/python/cp314-cp314/bin/python
          artifact="wheelhouse/${{ github.sha }}"
          test -f "$artifact/manifest.sha256"
          test -f "$artifact/builder-evidence.json"
          test -f "$artifact/requirements.install.lock"
          "$python" - "$artifact" "${{ github.sha }}" <<'PY'
          import hashlib
          import json
          import pathlib
          import re
          import sys

          root = pathlib.Path(sys.argv[1])
          target_sha = sys.argv[2]
          manifest = json.loads((root / "manifest.sha256").read_text())
          evidence = json.loads((root / "builder-evidence.json").read_text())
          if manifest["target_sha"] != target_sha or evidence["target_sha"] != target_sha:
              raise SystemExit("artifact target binding mismatch")
          if manifest["source_lock_sha256"] != hashlib.sha256(pathlib.Path("twocomms/requirements.lock").read_bytes()).hexdigest():
              raise SystemExit("artifact source lock binding mismatch")
          if set(manifest["files"]) != {path.name for path in root.iterdir() if path.name != "manifest.sha256"}:
              raise SystemExit("artifact manifest file set mismatch")
          for name, expected in manifest["files"].items():
              actual = hashlib.sha256((root / name).read_bytes()).hexdigest()
              if actual != expected:
                  raise SystemExit(f"artifact hash mismatch: {name}")
          if not re.fullmatch(r"[0-9a-f]{40}", target_sha):
              raise SystemExit("invalid target SHA")
          if evidence["builder_image_digest"] != "sha256:fdb9a9c223b215604dc7b6f7e8fff4b39bfea5fbaa7777a2e5544a60dfa437f8":
              raise SystemExit("builder image provenance mismatch")
          if evidence["libffi_devel"] != "libffi-devel-3.1-24.el8.x86_64":
              raise SystemExit("libffi build dependency provenance mismatch")
          if evidence["mariadb_connector_c_version"] != "3.3.19":
              raise SystemExit("MariaDB Connector/C version provenance mismatch")
          if evidence["mariadb_connector_c_source_sha256"] != "672bec76cfbb2fdb46ad4f681cd1e63c80721d7a07316e5849dc63e69d6ecdf7":
              raise SystemExit("MariaDB Connector/C source provenance mismatch")
          if evidence["mariadb_connector_c_source_url"] != "https://dlm.mariadb.com/4751094/Connectors/c/connector-c-3.3.19/mariadb-connector-c-3.3.19-rhel8-amd64.tar.gz":
              raise SystemExit("MariaDB Connector/C source URL provenance mismatch")
          if evidence["mariadb_connector_c_library_sha256"] != "5395b9398e16b3313ed3d799771ec33a4661beb91833648b457a0bfdb0fb36ee":
              raise SystemExit("MariaDB Connector/C library provenance mismatch")
          if evidence["mariadb_connector_c_soname"] != "libmariadb.so.3":
              raise SystemExit("MariaDB Connector/C SONAME provenance mismatch")
          if not re.fullmatch(r"mysqlclient\.libs/libmariadb-[0-9a-f]+\.so\.3", evidence["mysqlclient_bundled_library_name"]):
              raise SystemExit("mysqlclient bundled library mapping mismatch")
          if not re.fullmatch(r"[0-9a-f]{64}", evidence["mysqlclient_bundled_library_sha256"]):
              raise SystemExit("mysqlclient bundled library hash mismatch")
          if evidence["mysqlclient_bundled_library_soname"] != pathlib.PurePosixPath(evidence["mysqlclient_bundled_library_name"]).name:
              raise SystemExit("mysqlclient bundled library SONAME mismatch")
          PY

      - name: Upload immutable wheelhouse artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-wheelhouse-${{ github.sha }}
          path: wheelhouse/${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
