name: Immutable release wheelhouse

on:
  push:
    branches: [main]
    paths:
      - "scripts/build_release_wheelhouse.py"
      - "scripts/build_http_ece_wheel.py"
      - "scripts/verify_locked_requirements.py"
      - "twocomms/requirements.lock"
      - ".github/workflows/immutable-release-wheelhouse.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build CPython 3.14 wheelhouse
    runs-on: ubuntu-24.04
    container:
      image: quay.io/pypa/manylinux_2_28_x86_64@sha256:fdb9a9c223b215604dc7b6f7e8fff4b39bfea5fbaa7777a2e5544a60dfa437f8
    steps:
      - name: Check out the exact release revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify the pinned build runtime
        shell: bash
        run: |
          set -euo pipefail
          python=/opt/python/cp314-cp314/bin/python
          test -x "$python"
          test "$("$python" -c 'import platform, sys; print(platform.python_version())')" = "3.14.6"
          test "$("$python" -c 'import sysconfig; print(sysconfig.get_config_var("SOABI"))')" = "cpython-314-x86_64-linux-gnu"
          test "$(ldd --version 2>&1 | head -n 1)" = "ldd (GNU libc) 2.28"
          command -v auditwheel >/dev/null
          auditwheel --version

      - name: Install hash-pinned libffi build headers
        shell: bash
        run: |
          set -euo pipefail
          rpm_name=libffi-devel-3.1-24.el8.x86_64.rpm
          rpm_path="/tmp/$rpm_name"
          rpm_url="https://repo.almalinux.org/almalinux/8/BaseOS/x86_64/os/Packages/$rpm_name"
          rpm_sha256=8f5458bc961d226a0383575823f04d89989d801d11b1eeece2fe5498df49f186
          curl --fail --silent --show-error --location "$rpm_url" --output "$rpm_path"
          printf '%s  %s\n' "$rpm_sha256" "$rpm_path" | sha256sum --check --strict -
          rpm -Uvh --replacepkgs "$rpm_path"
          test "$(rpm -q libffi-devel)" = "libffi-devel-3.1-24.el8.x86_64"
          test -f /usr/include/ffi.h

      - name: Install hash-pinned MariaDB Connector/C build libraries
        shell: bash
        run: |
          set -euo pipefail
          base_url="https://repo.almalinux.org/almalinux/8/AppStream/x86_64/os/Packages"
          config_name="mariadb-connector-c-config-3.1.11-2.el8_3.noarch.rpm"
          runtime_name="mariadb-connector-c-3.1.11-2.el8_3.x86_64.rpm"
          devel_name="mariadb-connector-c-devel-3.1.11-2.el8_3.x86_64.rpm"
          config_path="/tmp/$config_name"
          runtime_path="/tmp/$runtime_name"
          devel_path="/tmp/$devel_name"
          curl --fail --silent --show-error --location "$base_url/$config_name" --output "$config_path"
          curl --fail --silent --show-error --location "$base_url/$runtime_name" --output "$runtime_path"
          curl --fail --silent --show-error --location "$base_url/$devel_name" --output "$devel_path"
          printf '%s  %s\n' \
            'eca6eb7026bfbb5ff51825587af1376bd6bd957dea4ec89cc7e9971a32983b0f' "$config_path" \
            '85c37e356ca0e8114acfbe5fd5043ce1a95c35354851cc91b4066104e11dd658' "$runtime_path" \
            'e7f9b90bb970c95179842fce9edf84ec943bc19b4bdd7029645e05d1e6a2e295' "$devel_path" \
            | sha256sum --check --strict -
          rpm -Uvh --replacepkgs "$config_path" "$runtime_path"
          # The manylinux runtime image deliberately omits openssl-devel,
          # which is metadata-only for this C extension build. Keep the
          # exception scoped to the verified development RPM; runtime package
          # dependencies remain installed and checked normally.
          rpm -Uvh --replacepkgs --nodeps "$devel_path"
          ldconfig
          test "$(rpm -q mariadb-connector-c-config)" = "mariadb-connector-c-config-3.1.11-2.el8_3.noarch"
          test "$(rpm -q mariadb-connector-c)" = "mariadb-connector-c-3.1.11-2.el8_3.x86_64"
          test "$(rpm -q mariadb-connector-c-devel)" = "mariadb-connector-c-devel-3.1.11-2.el8_3.x86_64"
          test -f /etc/my.cnf
          test -f /usr/include/mysql/mysql.h
          test -f /usr/lib64/libmariadb.so.3
          ldd_output="$(ldd /usr/lib64/libmariadb.so.3)"
          if grep -F "not found" <<<"$ldd_output"; then
            exit 1
          fi

      - name: Build and verify the immutable wheelhouse
        shell: bash
        run: |
          set -euo pipefail
          python=/opt/python/cp314-cp314/bin/python
          "$python" scripts/build_release_wheelhouse.py \
            --target-sha "${{ github.sha }}" \
            --lock twocomms/requirements.lock \
            --wheelhouse "wheelhouse/${{ github.sha }}" \
            --python "$python" \
            --auditwheel auditwheel \
            --image-digest "sha256:fdb9a9c223b215604dc7b6f7e8fff4b39bfea5fbaa7777a2e5544a60dfa437f8"

      - name: Assert artifact provenance
        shell: bash
        run: |
          set -euo pipefail
          python=/opt/python/cp314-cp314/bin/python
          artifact="wheelhouse/${{ github.sha }}"
          test -f "$artifact/manifest.sha256"
          test -f "$artifact/builder-evidence.json"
          test -f "$artifact/requirements.install.lock"
          "$python" - "$artifact" "${{ github.sha }}" <<'PY'
          import hashlib
          import json
          import pathlib
          import re
          import sys

          root = pathlib.Path(sys.argv[1])
          target_sha = sys.argv[2]
          manifest = json.loads((root / "manifest.sha256").read_text())
          evidence = json.loads((root / "builder-evidence.json").read_text())
          if manifest["target_sha"] != target_sha or evidence["target_sha"] != target_sha:
              raise SystemExit("artifact target binding mismatch")
          if manifest["source_lock_sha256"] != hashlib.sha256(pathlib.Path("twocomms/requirements.lock").read_bytes()).hexdigest():
              raise SystemExit("artifact source lock binding mismatch")
          if set(manifest["files"]) != {path.name for path in root.iterdir() if path.name != "manifest.sha256"}:
              raise SystemExit("artifact manifest file set mismatch")
          for name, expected in manifest["files"].items():
              actual = hashlib.sha256((root / name).read_bytes()).hexdigest()
              if actual != expected:
                  raise SystemExit(f"artifact hash mismatch: {name}")
          if not re.fullmatch(r"[0-9a-f]{40}", target_sha):
              raise SystemExit("invalid target SHA")
          if evidence["builder_image_digest"] != "sha256:fdb9a9c223b215604dc7b6f7e8fff4b39bfea5fbaa7777a2e5544a60dfa437f8":
              raise SystemExit("builder image provenance mismatch")
          if evidence["libffi_devel"] != "libffi-devel-3.1-24.el8.x86_64":
              raise SystemExit("libffi build dependency provenance mismatch")
          if evidence["mariadb_connector_c"] != "mariadb-connector-c-3.1.11-2.el8_3.x86_64":
              raise SystemExit("MariaDB Connector/C provenance mismatch")
          if evidence["mariadb_connector_c_devel"] != "mariadb-connector-c-devel-3.1.11-2.el8_3.x86_64":
              raise SystemExit("MariaDB Connector/C development provenance mismatch")
          if evidence["mariadb_connector_c_config"] != "mariadb-connector-c-config-3.1.11-2.el8_3.noarch":
              raise SystemExit("MariaDB Connector/C configuration provenance mismatch")
          PY

      - name: Upload immutable wheelhouse artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-wheelhouse-${{ github.sha }}
          path: wheelhouse/${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
